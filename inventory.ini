# Ansible Inventory File for Remote Linux Servers
# Replace the IP addresses and hostnames with your actual server details

[remote_servers]
# Example server entries - replace with your actual servers
server1 ansible_host=192.168.1.100 ansible_user=ubuntu ansible_ssh_private_key_file=~/.ssh/id_rsa
server2 ansible_host=192.168.1.101 ansible_user=ubuntu ansible_ssh_private_key_file=~/.ssh/id_rsa
# server3 ansible_host=10.0.0.50 ansible_user=centos ansible_ssh_private_key_file=~/.ssh/id_rsa

[remote_servers:vars]
# Global variables for all servers in the remote_servers group
ansible_ssh_common_args='-o StrictHostKeyChecking=no'
ansible_python_interpreter=/usr/bin/python3

# Example groups for different environments
[development]
# dev-server ansible_host=192.168.1.200 ansible_user=ubuntu

[staging]
# staging-server ansible_host=192.168.1.201 ansible_user=ubuntu

[production]
# prod-server1 ansible_host=10.0.1.100 ansible_user=ubuntu
# prod-server2 ansible_host=10.0.1.101 ansible_user=ubuntu

# Example group for different OS types
[ubuntu_servers]
# server1
# server2

[centos_servers]
# server3

# All servers vars
[all:vars]
# Timezone setting
timezone=UTC

# SSH settings
ansible_ssh_port=22
ansible_ssh_timeout=30
